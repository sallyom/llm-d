<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>llm-d Distributed Tracing Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="logo">
        <span class="logo-text">llm-d</span>
        <span class="logo-subtitle">Distributed Tracing Demo</span>
      </div>
      <div class="nav-controls">
        <span class="nav-label">Navigate</span>
        <button class="nav-btn" id="prevStageBtn" onclick="prevStage()">&#8592;</button>
        <span class="stage-counter" id="stageCounter">1-4</span>
        <button class="nav-btn" id="nextStageBtn" onclick="nextStage()">&#8594;</button>
        <button class="nav-btn jump-btn" onclick="toggleJumpMenu()">Jump</button>
        <div class="jump-menu" id="jumpMenu"></div>
      </div>
    </header>

    <!-- Stage Progress Bar (dynamically rendered) -->
    <div class="progress-bar">
      <div class="progress-track" id="progressTrack"></div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      <!-- Stage Header -->
      <div class="stage-header">
        <span class="stage-badge" id="stageBadge">GATEWAY</span>
        <span class="stage-of" id="stageOf">Stage 1 of 4</span>
      </div>
      <h2 class="stage-title" id="stageTitle">Gateway Request</h2>
      <p class="stage-subtitle" id="stageSubtitle">Incoming request enters the llm-d stack</p>

      <div class="content-grid">
        <!-- Left: Architecture Diagram -->
        <div class="arch-panel">
          <div class="arch-diagram" id="archDiagram">
            <!-- Dynamically rendered per stage -->
          </div>
        </div>

        <!-- Right: Metrics + Span Details -->
        <div class="metrics-panel">
          <div class="metrics-grid" id="metricsGrid">
            <!-- Dynamically rendered per stage -->
          </div>

          <!-- Span Attributes Table -->
          <div class="span-detail" id="spanDetail">
            <h3 class="span-name" id="spanName"></h3>
            <table class="attr-table" id="attrTable">
              <thead><tr><th>Attribute</th><th>Value</th></tr></thead>
              <tbody id="attrBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Trace Waterfall -->
      <div class="waterfall-section" id="waterfallSection"></div>

      <!-- Bottom Description -->
      <div class="description-box" id="descriptionBox"></div>
    </div>

    <!-- Footer Navigation -->
    <footer class="bottom-bar">
      <button class="footer-btn prev-btn" id="prevBtn" onclick="prevStage()">&#8592; Previous</button>
      <span class="footer-title" id="footerTitle">Precise Prefix Cache-Aware Routing</span>
      <button class="footer-btn next-btn" id="nextBtn" onclick="nextStage()">Next &#8594;</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
