apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-vllm-openai
  labels:
    app.kubernetes.io/name: gemma4-vllm-openai
    app.kubernetes.io/part-of: upstream-vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gemma4-vllm-openai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gemma4-vllm-openai
        app.kubernetes.io/part-of: upstream-vllm
    spec:
      containers:
        - name: openai
          image: vllm/vllm-openai:gemma4
          imagePullPolicy: IfNotPresent
          args:
            - google/gemma-4-26B-A4B-it
            - --tensor-parallel-size
            - "4"
            - --distributed-executor-backend
            - mp
            - --max-model-len
            - "32768"
            - --gpu-memory-utilization
            - "0.90"
            - --enable-auto-tool-choice
            - --reasoning-parser
            - gemma4
            - --tool-call-parser
            - gemma4
            - --language-model-only
            - --otlp-traces-endpoint
            - grpc://otel-collector:4317
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: XDG_CACHE_HOME
              value: /.cache
            - name: HF_HOME
              value: /.cache/huggingface
            - name: TRANSFORMERS_CACHE
              value: /.cache/huggingface
            - name: TRITON_CACHE_DIR
              value: /.cache/triton
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /.cache/torchinductor
            - name: HOME
              value: /.cache/home
            - name: OTEL_SERVICE_NAME
              value: gemma4-vllm-openai
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: grpc://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
              value: "true"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=gemma4-vllm-openai,model.name=google/gemma-4-26B-A4B-it
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "4"
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: cache
              mountPath: /.cache
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gemma4-openai
  labels:
    app.kubernetes.io/name: gemma4-vllm-openai
spec:
  selector:
    app.kubernetes.io/name: gemma4-vllm-openai
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
